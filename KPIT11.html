 TABS.forEach(([k])=>{$(k+'v').style.display=S.mode==k?'':'none';$('m-'+k).classList.toggle('on',S.mode==k)});
 const dayTab=S.mode=='plan'||S.mode=='nb';$('f-wk').style.display=$('f-day').style.display=dayTab?'':'none';
 ({plan:renderPlan,ov:renderOv,ng:renderNg,hv:renderHv,gk:()=>progView(['gk'],'gkv','Gắn kết tăng trưởng T11','DS tích lũy = 061 sau chiết khấu, mọi trạng thái, không tính hàng KM. Ngưỡng = DS nền × % mốc. Thưởng 100 điểm = 1đ.'),tl:()=>progView(['tl','ds'],'tlv','Tích lũy sản phẩm tập trung & Đại sứ T11','DS tích lũy = 061 sau chiết khấu, mọi trạng thái, không tính hàng KM. Thưởng = DS × hệ số điểm / 100, có mức tối đa.'),cb:renderCb,nb:renderNb,bn:renderBn})[S.mode]()}
$('tabs').innerHTML=TABS.map(([k,n])=>'<button id="m-'+k+'">'+n+'</button>').join('');
TABS.forEach(([k])=>$('m-'+k).onclick=()=>{S.mode=k;S.pf='';try{location.hash=k}catch(e){}render()});
$('f-sm').innerHTML='<option value="">Tất cả ĐDKD</option>'+D.sm.map((n,i)=>'<option value="'+i+'">'+esc(n)+'</option>').join('');
$('f-sm').onchange=e=>{S.sm=e.target.value===''?'':+e.target.value;try{localStorage.setItem('t11_sm',e.target.value)}catch(x){}render()};
const wkl=k=>{const m=addD(week0(),7*k);return (k?'Tuần sau':'Tuần này')+' · '+(oddOf(m)=='O'?'lẻ':'chẵn')+' '+dm(m)};
$('f-wk').innerHTML=[0,1].map(k=>'<option value="'+k+'">'+wkl(k)+'</option>').join('');$('f-wk').onchange=e=>{S.wk=+e.target.value;fillDay();render()};
function fillDay(){$('f-day').innerHTML='<option value="">Mọi ngày</option>'+DAYC.map(c=>'<option value="'+c+'">'+c+' · '+dm(dateOf(c))+'</option>').join('');$('f-day').value=S.day}
fillDay();$('f-day').onchange=e=>{S.day=e.target.value;render()};
let qt;$('q').oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{S.q=e.target.value.trim().toLowerCase();render()},200)};
try{const sv=localStorage.getItem('t11_sm');if(sv!==null&&sv!==''&&D.sm[+sv]){S.sm=+sv;$('f-sm').value=sv}}catch(e){}
{const h=(location.hash||'').slice(1);if(TABS.some(t=>t[0]==h))S.mode=h}
$('sub').innerHTML='Đơn hàng 061 từ '+dm(D.first)+' đến '+dm(D.last)+'/2026, tính mọi trạng thái ('+Object.entries(D.sum.st).map(([k,v])=>esc(k)+' '+v+' dòng').join(', ')+') · '+fn(D.sum.ord)+' đơn, '+fn(D.sum.kh)+' khách, DS trước CK '+ftr(D.sum.bd)+', sau CK '+ftr(D.sum.ad)+' · Lịch ghé và tuần lẻ/chẵn theo MCP T11 · <a href="https://phongnguyendanhlp.github.io/masan/KPIT10.html" target="_blank" rel="noopener">Xem trang tháng 10</a>';
render();
</script></body></html>
